<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Pong</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1d2b43, #101827 65%);
    }

    main { width: min(100%, 900px); text-align: center; }
    h1 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .12em; }
    .instructions { margin: 0 0 20px; color: #b7c4d8; }

    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 8vw, 72px);
      margin: 0 0 14px;
      font-size: 1rem;
      color: #cbd5e1;
    }

    .score { display: block; color: #fff; font-size: 2rem; font-variant-numeric: tabular-nums; }
    .game-wrap { position: relative; }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 8 / 5;
      border: 2px solid #41516a;
      border-radius: 12px;
      background: #080f1c;
      box-shadow: 0 20px 60px #0006;
      touch-action: none;
    }

    .status {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #a5b4fc;
      font-weight: 600;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 1px solid #64748b;
      border-radius: 8px;
      background: #26364f;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #344967; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>PONG</h1>
    <p class="instructions">Move your mouse over the court or use ↑ / ↓ to control your paddle. First to 5 wins.</p>
    <div class="scoreboard" aria-label="Score">
      <div>YOU<span class="score" id="player-score">0</span></div>
      <div>COMPUTER<span class="score" id="computer-score">0</span></div>
    </div>
    <div class="game-wrap">
      <canvas id="game" width="800" height="500" aria-label="Pong game. Use the up and down arrow keys or mouse to move your paddle."></canvas>
    </div>
    <p class="status" id="status" aria-live="polite">First to 5 points wins. Good luck!</p>
    <button id="restart" type="button">New game</button>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const playerScoreLabel = document.querySelector('#player-score');
      const computerScoreLabel = document.querySelector('#computer-score');
      const statusLabel = document.querySelector('#status');
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const PADDLE_WIDTH = 12;
      const PADDLE_HEIGHT = 90;
      const BALL_RADIUS = 9;
      const WINNING_SCORE = 5;

      const player = { x: 28, y: (HEIGHT - PADDLE_HEIGHT) / 2, speed: 7, score: 0 };
      const computer = { x: WIDTH - 28 - PADDLE_WIDTH, y: (HEIGHT - PADDLE_HEIGHT) / 2, speed: 4.3, score: 0 };
      const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 5, vy: 2.5 };
      const keys = new Set();
      let gameOver = false;
      let lastTime = 0;

      function resetBall(direction) {
        ball.x = WIDTH / 2;
        ball.y = HEIGHT / 2;
        const angle = (Math.random() * 0.7 - 0.35);
        const speed = 5;
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
      }

      function resetGame() {
        player.score = 0;
        computer.score = 0;
        player.y = computer.y = (HEIGHT - PADDLE_HEIGHT) / 2;
        playerScoreLabel.textContent = '0';
        computerScoreLabel.textContent = '0';
        gameOver = false;
        statusLabel.textContent = 'First to 5 points wins. Good luck!';
        resetBall(Math.random() < 0.5 ? -1 : 1);
      }

      function movePlayer(delta) {
        const direction = Number(keys.has('ArrowDown')) - Number(keys.has('ArrowUp'));
        player.y += direction * player.speed * delta;
        player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y));
      }

      function update(delta) {
        if (gameOver) return;

        movePlayer(delta);

        // The computer tracks the ball, but moves more slowly to keep the game fair.
        const computerCenter = computer.y + PADDLE_HEIGHT / 2;
        const targetCenter = ball.y + ball.vy * 5;
        if (computerCenter < targetCenter - 8) computer.y += computer.speed * delta;
        else if (computerCenter > targetCenter + 8) computer.y -= computer.speed * delta;
        computer.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, computer.y));

        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;

        // Bounce off the top and bottom walls.
        if (ball.y - BALL_RADIUS <= 0) {
          ball.y = BALL_RADIUS;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + BALL_RADIUS >= HEIGHT) {
          ball.y = HEIGHT - BALL_RADIUS;
          ball.vy = -Math.abs(ball.vy);
        }

        // Paddle collision uses the ball's leading edge and vertical overlap.
        const hitPlayer = ball.vx < 0 && ball.x - BALL_RADIUS <= player.x + PADDLE_WIDTH &&
          ball.x + BALL_RADIUS >= player.x && ball.y + BALL_RADIUS >= player.y &&
          ball.y - BALL_RADIUS <= player.y + PADDLE_HEIGHT;
        const hitComputer = ball.vx > 0 && ball.x + BALL_RADIUS >= computer.x &&
          ball.x - BALL_RADIUS <= computer.x + PADDLE_WIDTH && ball.y + BALL_RADIUS >= computer.y &&
          ball.y - BALL_RADIUS <= computer.y + PADDLE_HEIGHT;

        if (hitPlayer || hitComputer) {
          const paddle = hitPlayer ? player : computer;
          const hitOffset = (ball.y - (paddle.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
          ball.vx = Math.abs(ball.vx) * (hitPlayer ? 1 : -1) * 1.04;
          ball.vy = hitOffset * 5.5;
          // Keep the ball from sticking inside a paddle after a collision.
          ball.x = hitPlayer ? player.x + PADDLE_WIDTH + BALL_RADIUS : computer.x - BALL_RADIUS;
        }

        if (ball.x + BALL_RADIUS < 0) {
          computer.score++;
          computerScoreLabel.textContent = String(computer.score);
          awardPoint(-1);
        } else if (ball.x - BALL_RADIUS > WIDTH) {
          player.score++;
          playerScoreLabel.textContent = String(player.score);
          awardPoint(1);
        }
      }

      function awardPoint(nextDirection) {
        const winner = player.score >= WINNING_SCORE ? 'You win!' :
          computer.score >= WINNING_SCORE ? 'Computer wins!' : '';
        if (winner) {
          gameOver = true;
          statusLabel.textContent = `${winner} Press “New game” to play again.`;
        } else {
          statusLabel.textContent = player.score > computer.score ? 'You are ahead!' : 'Point scored!';
          resetBall(nextDirection);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#080f1c';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.setLineDash([10, 12]);
        ctx.strokeStyle = '#34445c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(WIDTH / 2, 0);
        ctx.lineTo(WIDTH / 2, HEIGHT);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillRect(computer.x, computer.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#60a5fa';
        ctx.shadowColor = '#60a5fa';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function frame(time) {
        const delta = lastTime ? Math.min((time - lastTime) / 16.67, 2) : 1;
        lastTime = time;
        update(delta);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          event.preventDefault();
          keys.add(event.key);
        }
      });
      window.addEventListener('keyup', (event) => keys.delete(event.key));
      window.addEventListener('blur', () => keys.clear());

      canvas.addEventListener('pointermove', (event) => {
        const bounds = canvas.getBoundingClientRect();
        const scaleY = HEIGHT / bounds.height;
        player.y = (event.clientY - bounds.top) * scaleY - PADDLE_HEIGHT / 2;
        player.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, player.y));
      });

      document.querySelector('#restart').addEventListener('click', resetGame);
      resetBall(1);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
